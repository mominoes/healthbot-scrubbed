[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbot"
version = "0.1.0"
description = "Privacy-preserving health records scrubber and knowledge base"
requires-python = ">=3.11"
dependencies = ["pymupdf", "pymupdf4llm", "pyyaml", "python-dateutil"]

[project.optional-dependencies]
dev = ["pytest", "reportlab"]

[project.scripts]
healthbot = "healthbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
