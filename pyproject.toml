[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbot"
version = "0.1.0"
description = "Privacy-preserving health records scrubber and knowledge base"
requires-python = ">=3.11"
dependencies = ["pymupdf", "pymupdf4llm", "pyyaml", "python-dateutil", "gdown"]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "httpx"]
web = ["fastapi", "uvicorn", "claude-agent-sdk", "markdown-it-py"]

[project.scripts]
healthbot = "healthbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"healthbot.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
